<div class="container">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
        <button mat-icon-button (click)="goBack()">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <h2>Admin Dashboard</h2>
    </div>

    <mat-tab-group>
        <mat-tab label="Quản lý Người dùng">
            <div class="tab-content">
                <table mat-table [dataSource]="users" class="mat-elevation-z8">
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef> ID </th>
                        <td mat-cell *matCellDef="let user"> {{user.id}} </td>
                    </ng-container>

                    <ng-container matColumnDef="username">
                        <th mat-header-cell *matHeaderCellDef> Tên đăng nhập </th>
                        <td mat-cell *matCellDef="let user"> {{user.username}} </td>
                    </ng-container>

                    <ng-container matColumnDef="role">
                        <th mat-header-cell *matHeaderCellDef> Vai trò </th>
                        <td mat-cell *matCellDef="let user">
                            <span [style.color]="user.role === 'ADMIN' ? 'red' : 'blue'">
                                {{user.role}}
                            </span>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="['id', 'username', 'role']"></tr>
                    <tr mat-row *matRowDef="let row; columns: ['id', 'username', 'role'];"></tr>
                </table>
            </div>
        </mat-tab>

        <mat-tab label="Quản lý Báo cáo">
            <div class="tab-content">
                <table mat-table [dataSource]="reports" class="mat-elevation-z8"
                    *ngIf="reports.length > 0; else noReports">
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef> ID </th>
                        <td mat-cell *matCellDef="let report"> {{report.id}} </td>
                    </ng-container>

                    <ng-container matColumnDef="quizId">
                        <th mat-header-cell *matHeaderCellDef> Quiz ID </th>
                        <td mat-cell *matCellDef="let report"> {{report.quizId}} </td>
                    </ng-container>

                    <ng-container matColumnDef="reason">
                        <th mat-header-cell *matHeaderCellDef> Lý do </th>
                        <td mat-cell *matCellDef="let report"> {{report.reason}} </td>
                    </ng-container>

                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef> Trạng thái </th>
                        <td mat-cell *matCellDef="let report"> {{report.status}} </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef> Hành động </th>
                        <td mat-cell *matCellDef="let report">
                            <button mat-button color="primary" *ngIf="report.status === 'PENDING'"
                                (click)="updateReportStatus(report, 'RESOLVED')">
                                Duyệt
                            </button>
                            <button mat-button color="warn" *ngIf="report.status === 'PENDING'"
                                (click)="updateReportStatus(report, 'REJECTED')">
                                Từ chối
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="['id', 'quizId', 'reason', 'status', 'actions']"></tr>
                    <tr mat-row *matRowDef="let row; columns: ['id', 'quizId', 'reason', 'status', 'actions'];"></tr>
                </table>

                <ng-template #noReports>
                    <p class="empty-state">Không có báo cáo nào.</p>
                </ng-template>
            </div>
        </mat-tab>
    </mat-tab-group>
</div>
